# Local API plus the knowledge and serving sketches.
# This file has not been started. The committed benchmark uses the local mock.

services:
  api:
    build: .
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment:
      INTELLIFORGE_MODE: local-mock

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["knowledge"]
    environment:
      POSTGRES_USER: intelliforge
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: intelliforge
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5
    profiles: ["knowledge"]
    environment:
      NEO4J_AUTH: neo4j/local-demo-only
    ports:
      - "7474:7474"
      - "7687:7687"

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    ports:
      - "8000:8000"
    command: ["--model", "Qwen/Qwen2.5-3B-Instruct"]
